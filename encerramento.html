<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saúde Mental Sem Fronteiras - Plano de Continuidade</title>
    <style>
        :root {
            --primary-color: #4a148c;
            --rose-accent: #c48b9f;
            --secondary-color: #e1bee7;
            --text-color: #333;
            --light-bg: #faf5fb;
            --white: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0; color: var(--text-color);
            background-color: var(--white); height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        header {
            background-color: var(--white); padding: 10px 5%;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #f0e2ec; height: 70px; flex-shrink: 0;
        }

        .user-info { text-align: left; }
        .user-name { font-size: 16px; font-weight: bold; color: var(--primary-color); margin: 0; }
        .user-sub { font-size: 11px; color: #777; margin: 0; }

        nav { display: flex; gap: 10px; align-items: center; }
        nav a { color: var(--text-color); text-decoration: none; font-weight: 600; font-size: 13px; padding: 8px 14px; border-radius: 20px; transition: all 0.3s; }
        nav a:hover { color: var(--primary-color); background-color: var(--light-bg); }
        nav a.active { color: var(--primary-color); background-color: #f3e8f8; }
        .btn-logout { background-color: #ff3b30 !important; color: var(--white) !important; padding: 8px 16px !important; border-radius: 20px !important; font-weight: bold !important; }

        main {
            flex: 1; padding: 20px 8%; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
        }

        .conclusion-card {
            background-color: var(--white); border-radius: 12px; border: 1px solid #e8d8e3;
            padding: 30px; width: 100%; max-width: 650px; box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        h2 { color: var(--primary-color); font-size: 22px; margin: 0 0 5px 0; text-align: center; }
        .subtitle { text-align: center; color: #666; font-size: 13px; margin-bottom: 20px; }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; font-weight: bold; color: var(--primary-color); margin-bottom: 4px; }
        textarea { width: 100%; height: 70px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; font-family: inherit; }

        .btn-finish { background-color: #2e7d32; color: var(--white); border: none; padding: 12px; width: 100%; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }

        footer { background-color: #2a0b52; color: var(--secondary-color); text-align: center; padding: 10px 8%; font-size: 12px; height: 45px; flex-shrink: 0; }
    </style>
</head>
<body>

    <header>
        <div class="user-info">
            <div class="user-name">Área do Paciente</div>
            <div class="user-sub">Acompanhamento & Evolução</div>
        </div>
        <nav>
            <a href="minha-area.html">Início</a>
            <a href="anamnese.html">Anamnese</a>
            <a href="agendamento.html">Pacote & Agenda</a>
            <a href="pagamento.html">Pagamentos</a>
            <a href="sessoes.html">Teleconsulta & Tarefas</a>
            <a href="encerramento.html" class="active">Plano de Continuidade</a>
            <a href="index.html" class="btn-logout">Sair</a>
        </nav>
    </header>

    <main>
        <div class="conclusion-card">
            <h2>Plano de Continuidade & Prevenção</h2>
            <p class="subtitle">Estratégias para manutenção do seu bem-estar emocional.</p>

            <form id="encerramentoForm">
                <div class="form-group">
                    <label>Estratégias de Manutenção e Prevenção de Recaídas</label>
                    <textarea readonly>Prática de exercícios de respiração diafragmática, manutenção de atividades de lazer aos finais de semana e registro de diário em momentos de ansiedade elevada.</textarea>
                </div>

                <div class="form-group">
                    <label>Avaliação do Ciclo Terapêutico</label>
                    <textarea placeholder="Deixe seu feedback sobre o atendimento recebido..."></textarea>
                </div>

                <button type="submit" class="btn-finish">Enviar Avaliação do Atendimento</button>
            </form>
        </div>
    </main>

    <footer>
        Saúde Mental Sem Fronteiras • Acompanhamento em Saúde Mental
    </footer>

    <script>
        document.getElementById('encerramentoForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Obrigado pelo seu feedback! Suas respostas ajudam na constante melhoria do nosso atendimento.');
        });
    </script>

</body>
</html>
